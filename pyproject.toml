[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evidentia"
version = "0.1.0"
description = "Evidentia research assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.87",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
